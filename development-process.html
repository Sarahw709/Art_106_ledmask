<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Development Process — I See You, You See Me</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>

<body>
  <header>
    <h1>I See You, You See Me</h1>
  </header>
  <main>
    <div class="development-process">
      <p>
      <h3>Stage 1: The test stage</h3>
      </p>
      <figure class="process-media">
        <img src="images/ledteststrand.jpg"
          alt="Six colored LEDs with jumper wires, arranged in two groups on a white surface.">
        <p>
          My original test strands to get used to soldering.
        </p>
        <video controls playsinline preload="metadata">
          <source src="images/papertest.mp4" type="video/mp4">

          <source src="images/papertest.MOV" type="video/quicktime">
        </video>
        <p>My first papercraft, here I am figuring out which papercraft method to use and how it works.</p>
        <img src="images/teststrandboard.jpg"
          alt="A breadboard powered by a 9-volt battery, with blue, green, and red LEDs lit.">
        <p>My first successful test strand using a breadboard and battery.</p>
      </figure>
      <p>
      <h3>Stage 2: Making the half mask</h3>
      </p>
      <figure class="process-media">
        <img src="images/halfmask.jpg"
          alt="A cardboard half-mask base with a breadboard, battery, and toggle switch wired together.">
        <p>When I first started my mask, I was under the impression it would only be for the half mask portion of the
          assignment. However, I ended up really liking the design and decided to make it into my finished mask.</p>
      </figure>
      <p>
      <h3>Stage 3: The final product</h3>
      </p>
      <figure class="process-media">
        <img src="images/finishmask.jpg"
          alt="A finished kitsune mask with red and yellow LEDs lit.">
        <p>My finished mask.</p>
        <video controls playsinline preload="metadata">
          <source src="images/maskvideo.mp4" type="video/mp4">
        </video>
      </figure>
    </div>
    <nav class="page-links" aria-label="Sections">
      <a href="index.html">Main Page</a>
    </nav>
  </main>
</body>

</html>
